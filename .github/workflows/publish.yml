name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: npm run check

      - name: Bump patch version
        run: |
          LATEST=$(npm view pi-weave version 2>/dev/null || echo "0.1.0")
          PKG_VERSION=$(node -p "require('./package.json').version")
          IS_GT=$(node -e "
            const pa = '$PKG_VERSION'.split('.').map(Number);
            const pb = '$LATEST'.split('.').map(Number);
            let gt = false;
            for (let i = 0; i < 3; i++) {
              if ((pa[i]||0) > (pb[i]||0)) { gt = true; break; }
              if ((pa[i]||0) < (pb[i]||0)) break;
            }
            console.log(gt);
          ")
          if [ "$IS_GT" = "true" ]; then
            VERSION="v$PKG_VERSION"
          else
            npm version "$LATEST" --no-git-tag-version --allow-same-version
            VERSION=$(npm version patch --no-git-tag-version)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git tag "$VERSION" -f

      - name: Push tag
        run: |
          git push origin --tags --force

      - name: Publish to npm
        run: |
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "$VERSION" --title "$VERSION" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
